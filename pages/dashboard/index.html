<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QQ空间</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="rail">
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="收起侧栏" title="收起侧栏" aria-expanded="true" aria-controls="navigation">
          <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-11-3 3 3 3"/></svg><span class="nav-text">收起侧栏</span>
        </button>
        <div class="section-label">浏览空间</div>
        <nav class="tabs" id="navigation" aria-label="动态范围">
          <button class="tab active" data-scope="friends" type="button" aria-label="好友动态" title="好友动态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19v-1a6 6 0 0 1 12 0v1M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v1"/></svg><span class="nav-text">好友动态</span></button>
          <button class="tab" data-scope="self" type="button" aria-label="我的空间" title="我的空间"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg><span class="nav-text">我的空间</span></button>
          <span class="section-label">工作台</span>
          <button id="settingsButton" class="nav-button" type="button" aria-label="插件设置" title="插件设置"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="1.5"/><circle cx="16" cy="17" r="1.5"/></svg><span class="nav-text">插件设置</span></button>
        </nav>
      </section>
      <div class="workspace">
      <header class="topbar"><div class="breadcrumbs">工作台 / <strong id="crumb">好友动态</strong></div><div class="top-actions">
        <button id="paletteButton" type="button"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-3.7 2 2 0 0 1 1-3.7h2a4 4 0 0 0 4-4C21 6 17 3 12 3Z"/><circle cx="7.5" cy="10" r=".7"/><circle cx="10" cy="7" r=".7"/><circle cx="14" cy="7" r=".7"/><circle cx="17" cy="10" r=".7"/></svg>调色盘</button>
        <button id="themeToggle" type="button" aria-label="切换暗色模式" aria-pressed="false"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path id="themeIcon" d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/></svg><span>暗色模式</span></button>
        <button id="debugToggle" type="button" aria-label="切换调试日志" aria-pressed="false"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 9h8v6a4 4 0 0 1-8 0V9Zm1-3 1 3m5-3-1 3M5 11h3m8 0h3M5 16h3m8 0h3M12 10v8"/></svg><span>调试日志：关</span></button>
        <button id="refreshButton" type="button" title="刷新动态" aria-label="刷新动态"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 9a7 7 0 0 1 12-3l3 6M4 12l3 6a7 7 0 0 0 12-3"/></svg>刷新</button>
      </div></header>
      <section class="status-card" aria-label="插件信息检测">
        <div class="status-title"><strong>✦ 插件信息检测</strong><span>当前账号与动态状态</span></div>
        <div class="status-grid">
          <div class="status-panel"><h3>当前账号</h3><div class="account" id="accountBox"><span class="avatar" id="accountAvatarBtn" role="button" tabindex="0" title="点击切换账号" aria-label="切换账号"></span><div><strong id="accountName">未读号</strong><span id="accountMeta">等待状态</span></div><div class="account-menu" id="accountMenu" hidden></div></div></div>
          <div class="status-panel"><h3>连接状态</h3><span class="connection-status" id="statusText" data-state="unknown"><span class="status-light" aria-hidden="true"></span><span class="status-label">检查中</span></span></div>
          <div class="status-panel"><h3>动态概览</h3><span id="statusFeed">等待加载</span><div id="statusActivity" class="status-activity"></div></div>
        </div>
      </section>
      <div class="content-layout">
      <section class="timeline">
        <form class="composer" id="publishForm">
          <textarea id="publishContent" rows="4" maxlength="1200" placeholder="写点什么，发到 QQ 空间"></textarea>
          <div class="media-strip" id="mediaStrip"></div>
          <div class="composer-actions">
            <label class="upload-button">
              <input id="mediaInput" type="file" accept="image/*" multiple />
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>添加图片</span>
            </label>
            <button id="publishButton" class="primary" type="submit">发布说说</button>
          </div>
        </form>

        <div class="toolbar">
          <div>
            <strong id="feedTitle">好友动态</strong>
            <span id="feedMeta">准备加载</span>
          </div>
          <div class="filter-pills" aria-label="动态类型"><button class="active" data-filter="all" type="button">全部</button><button data-filter="image" type="button">图文</button><button data-filter="video" type="button">视频</button></div>
        </div>
        <form class="target-form" id="targetForm">
          <div class="target-row"><input id="targetUin" inputmode="numeric" autocomplete="off" placeholder="输入 QQ 号筛选" aria-label="按 QQ 号筛选好友动态" aria-describedby="filterHelp" /><button id="clearTarget" type="button" hidden>清除</button><button type="submit">查询该 QQ 的空间</button></div>
          <span id="filterHelp">仅筛选当前已加载的动态；也可查询该 QQ 的空间说说。</span>
        </form>
        <div class="notice" id="notice" hidden></div>
        <div class="feed" id="feed"></div>
        <button id="moreButton" class="load-more" type="button" hidden>加载更多</button>
      </section>

      <dialog class="detail-dialog" id="detailDialog" aria-label="说说详情">
      <aside class="detail" id="detailPane" aria-label="说说详情">
        <button id="detailClose" class="detail-close" type="button" aria-label="关闭详情">✕</button>
        <div class="detail-empty" id="detailEmpty">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3; margin-bottom: 12px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <strong>选择一条说说</strong>
          <span>详情、评论和回复会显示在这里。</span>
        </div>
        <div id="detailContent" hidden></div>
      </aside>
      </dialog>
      </div>
      </div>
    </main>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <form id="settingsForm">
        <div class="settings-heading">
          <h2 id="settingsTitle">插件配置</h2>
          <button id="settingsClose" type="button" aria-label="关闭">✕</button>
        </div>
        <p class="muted">此处包含全部插件配置，可向下滚动查看。保存后请重载插件，确保轮询计划及连接设置生效。</p>
        <div id="settingsFields"></div>
        <p id="settingsError" class="settings-error" role="alert"></p>
        <button class="primary" type="submit">保存配置</button>
      </form>
    </dialog>
    <dialog id="paletteDialog" class="settings-dialog palette-dialog" aria-labelledby="paletteTitle">
      <div class="settings-heading"><h2 id="paletteTitle">个性化调色盘</h2><button id="paletteClose" type="button" aria-label="关闭调色盘">✕</button></div>
      <p class="muted">调节两种颜色和渐变强度，颜色设置保存在当前浏览器。</p>
      <div class="palette-fields"><label>第一颜色<input type="color" id="colorOne" value="#e1b34e"></label><label>第二颜色<input type="color" id="colorTwo" value="#bb7a14"></label></div>
      <label class="gradient-field">渐变强度 <output id="gradientValue">70%</output><input id="gradient" type="range" min="0" max="100" step="1" value="70"></label>
      <div class="palette-actions"><button id="paletteReset" type="button">恢复默认</button><button id="paletteDone" class="primary" type="button">完成</button></div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
